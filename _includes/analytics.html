{% if site.google_analytics_ga4 %}
<!-- Google Analytics 4 — consent-gated (GDPR / ePrivacy for EEA, UK and CH).
     Analytics stay denied by default; _includes/consent-banner.html asks first
     and updates the decision. Nothing is measured until the visitor accepts. -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_ga4 }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  // Google Consent Mode v2 keys, all denied until accepted.
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied',
    wait_for_update: 500
  });

  // Honour a previous decision before the first page_view is sent.
  try {
    if (localStorage.getItem('consent:analytics') === 'granted') {
      gtag('consent', 'update', { analytics_storage: 'granted' });
    }
  } catch (e) { /* private mode: stay denied */ }

  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics_ga4 }}', { anonymize_ip: true });
</script>
{% endif %}
